name: iOS compile

on:
  pull_request:
    paths:
      - "Finally/**"
      - "FinallyWidget/**"
      - "FinallyTests/**"
      - "Finally.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/ios-compile.yml"
  push:
    branches:
      - main
    paths:
      - "Finally/**"
      - "FinallyWidget/**"
      - "FinallyTests/**"
      - "Finally.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/ios-compile.yml"

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Compile app
        run: >-
          xcodebuild build
          -project Finally.xcodeproj
          -scheme Finally
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          -quiet

      - name: Compile tests
        run: >-
          xcodebuild build-for-testing
          -project Finally.xcodeproj
          -scheme Finally
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          -quiet
