name: iOS compile

on:
  pull_request:
    paths:
      - "Finally/**"
      - "FinallyWidget/**"
      - "FinallyTests/**"
      - "FinallyUITests/**"
      - "Finally.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/ios-compile.yml"
  push:
    branches:
      - main
    paths:
      - "Finally/**"
      - "FinallyWidget/**"
      - "FinallyTests/**"
      - "FinallyUITests/**"
      - "Finally.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/ios-compile.yml"

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Compile app
        run: >-
          xcodebuild build
          -project Finally.xcodeproj
          -scheme Finally
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          -quiet

      - name: Compile tests
        run: >-
          xcodebuild build-for-testing
          -project Finally.xcodeproj
          -scheme Finally
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          -quiet

  launch:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ios: ["17.5", "26.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install simulator runtime
        run: |
          version='${{ matrix.ios }}'
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${version//./-}"
          if xcrun simctl list runtimes available --json | python3 -c 'import json, sys; sys.exit(0 if any(r["identifier"] == sys.argv[1] for r in json.load(sys.stdin)["runtimes"]) else 1)' "$runtime"; then
            echo "iOS $version runtime is installed"
          else
            xcodebuild -downloadPlatform iOS -buildVersion "$version"
          fi

      - name: Create fresh iPhone simulator
        run: |
          version='${{ matrix.ios }}'
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${version//./-}"
          device=$(xcrun simctl create 'Finally launch' com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro "$runtime")
          echo "LAUNCH_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b

      - name: Verify onboarding and task screens
        run: >-
          xcodebuild test
          -project Finally.xcodeproj
          -scheme Finally
          -destination "platform=iOS Simulator,id=$LAUNCH_SIMULATOR"
          -only-testing:FinallyUITests
          CODE_SIGNING_ALLOWED=NO
          -quiet
