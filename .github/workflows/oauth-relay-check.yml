name: OAuth relay check

on:
  pull_request:
    paths:
      - "vercel-notion-auth/**"
      - ".github/workflows/oauth-relay-check.yml"
  push:
    branches: [main]
    paths:
      - "vercel-notion-auth/**"
      - ".github/workflows/oauth-relay-check.yml"

permissions:
  contents: read

concurrency:
  group: oauth-relay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel-notion-auth

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vercel-notion-auth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck serverless handlers
        run: npm run typecheck
