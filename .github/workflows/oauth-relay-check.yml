name: OAuth relay check

on:
  pull_request:
    paths:
      - "vercel-notion-auth/**"
      - ".github/workflows/oauth-relay-check.yml"
  push:
    branches: [main]
    paths:
      - "vercel-notion-auth/**"
      - ".github/workflows/oauth-relay-check.yml"

permissions:
  contents: read

concurrency:
  group: oauth-relay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel-notion-auth

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vercel-notion-auth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck serverless handlers
        run: npm run typecheck
