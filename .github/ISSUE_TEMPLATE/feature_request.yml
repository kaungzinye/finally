name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and the provider or screen it affects.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - iOS app
        - OAuth / infrastructure
        - Widget
        - Sync
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point does this address?
      placeholder: Non-owner Notion members can't tell why task creation fails silently...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about
    validations:
      required: false

  - type: dropdown
    id: willing
    attributes:
      label: Are you willing to submit a PR?
      options:
        - "Yes, I can open a PR"
        - "Maybe, with some guidance"
        - "No, just suggesting"
    validations:
      required: true
