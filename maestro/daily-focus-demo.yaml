# The runner launches the in-memory fixture with -daily-focus-demo first.
appId: com.kaungzinye.finally
---
# The personal agent proposed the day, so it waits for Confirm.
- extendedWaitUntil:
    visible: "3 things to do"
    timeout: 10000
- assertVisible: "0 of 3 done"
- assertVisible: "Draft the brief"
- assertVisible: "Ship the release notes"
- assertVisible: "Deleted"
- assertVisible:
    id: "daily-focus-confirm"
- assertNotVisible: "NOW"

# The rest of Today, overdue first and the missed scheduled day last.
- scrollUntilVisible:
    element: "Book the dentist"
    direction: DOWN
    centerElement: true
- assertVisible: "Renew the passport"
- assertVisible: "Yesterday"
- assertVisible: "Send the invoice"
- assertVisible: "Water the plants"
- assertVisible: "from (Mon|Tue|Wed|Thu|Fri|Sat|Sun)"
- assertNotVisible: "Call the bank"

# Reschedule moves the scheduled day. Clearing it takes the missed day out of Today, and the
# overdue task stays because its deadline never moves.
- swipe:
    from:
      text: "Book the dentist"
    direction: LEFT
- tapOn: "Reschedule"
- tapOn: "Clear"
- assertNotVisible: "Book the dentist"
- swipe:
    from:
      text: "Renew the passport"
    direction: LEFT
- tapOn: "Reschedule"
- tapOn: "Clear"
- assertVisible: "Renew the passport"
- assertVisible: "Yesterday"

# Picking from Today into a full day replaces the chosen pick and confirms the day.
- scrollUntilVisible:
    element:
      id: "daily-focus-add-pick"
    direction: UP
    centerElement: true
- tapOn:
    id: "daily-focus-add-pick"
- assertVisible: "Water the plants"
- assertVisible: "Call the bank"
- tapOn: "Water the plants"
- assertVisible: "Choose a task to replace"
- tapOn: "Deleted"
- extendedWaitUntil:
    visible:
      id: "daily-focus-current-task"
    timeout: 5000
- assertNotVisible:
    id: "daily-focus-confirm"
- assertNotVisible: "Deleted"
- assertVisible: "0 of 3 done"

# Replanning drops a pick, which returns to Other tasks.
- scrollUntilVisible:
    element:
      id: "daily-focus-review-day"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "daily-focus-review-day"
- tapOn:
    text: "Drop focus pick"
    index: 0
- tapOn: "Done"
- assertVisible: "0 of 2 done"

# A pick can come from another provider workspace, and picking an unscheduled task schedules it.
- scrollUntilVisible:
    element:
      id: "daily-focus-add-pick"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "daily-focus-add-pick"
- tapOn: "Demo Notion"
- tapOn: "Demo Server"
- tapOn: "Update the changelog"
- assertVisible: "0 of 3 done"

# Finishing the current pick moves the one counter.
- scrollUntilVisible:
    element:
      id: "daily-focus-current-task"
    direction: UP
    centerElement: true
- tapOn: "Done"
- assertVisible: "1 of 3 done"
- tapOn: "Update the changelog"
- extendedWaitUntil:
    visible: "Deadline"
    timeout: 5000
- assertNotVisible: "Scheduled"
